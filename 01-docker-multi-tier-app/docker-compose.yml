version: '3.8'

services:
  # -------------------------
  # TIER 3: DATABASE
  # -------------------------
  db:
    image: postgres:15-alpine
    container_name: prod_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # TIER 2: BACKEND API
  # -------------------------
  api:
    build: ./backend
    container_name: prod_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # -------------------------
  # TIER 1: FRONTEND WEB
  # -------------------------
  web:
    build: ./frontend
    container_name: prod_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    networks:
      - frontend_net

# -------------------------
# VOLUMES & NETWORKS
# -------------------------
volumes:
  db_data:
    name: prod_db_data

networks:
  frontend_net:
    name: prod_frontend_net
  backend_net:
    name: prod_backend_net
    internal: true # Max Security: DB has no internet access
